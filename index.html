<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최지성 · UI 개발자</title>
<style>
@font-face{font-family:'Pretendard';src:url('portfolio/fonts/Pretendard_400.ttf') format('truetype');font-weight:400}
@font-face{font-family:'Pretendard';src:url('portfolio/fonts/Pretendard_700.ttf') format('truetype');font-weight:700}
@font-face{font-family:'SUIT';src:url('portfolio/fonts/SUIT_900.ttf') format('truetype');font-weight:900}
:root{--ink:#1d1a33;--lav:#d9cdfb;--pink:#ff7ac2;--sky:#bfe6ff;--mint:#c9f4dc;--paper:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background-color:var(--lav);background-image:radial-gradient(rgba(29,26,51,.25) 1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font-family:'Pretendard',sans-serif;line-height:1.5;display:flex;flex-direction:column;justify-content:center;padding:32px 16px;min-height:100%}
.wrap{width:100%;max-width:1040px;margin:0 auto}
header{margin-bottom:26px}
.chip{display:inline-block;background:var(--mint);border:3px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700;font-size:14px;box-shadow:2px 3px 0 var(--ink)}
h1{font-family:'SUIT',sans-serif;font-weight:900;font-size:clamp(40px,6vw,64px);letter-spacing:-.03em;line-height:1.1;margin-top:14px}
header p{font-size:clamp(16px,2.2vw,20px);margin-top:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:8px 9px 0 var(--ink);padding:14px;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:11px 12px 0 var(--ink)}
.pic{height:clamp(240px,46vh,420px);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.pic img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.resume .pic{background:var(--sky);padding:10px}
.folio .pic{background:#dcecff}
.card b{font-family:'SUIT',sans-serif;font-weight:900;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;margin-top:14px}
.go{font-style:normal;margin-top:12px;align-self:flex-start;background:var(--pink);border:3px solid var(--ink);border-radius:12px;padding:8px 18px;font-weight:700;box-shadow:3px 4px 0 var(--ink)}
.resume .go{background:var(--sky)}
footer{margin-top:30px;font-size:14px}
footer a{color:inherit;font-weight:700}
@media (max-width:700px){.cards{grid-template-columns:1fr}.pic{height:240px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="chip">UI 개발자 · 프론트엔드</span>
    <h1>최지성</h1>
    <p>불편한 화면을 겪어 본 사람으로서, 쓰기 편한 화면을 디자인하고 구현합니다.</p>
  </header>
  <main class="cards">
    <a class="card resume" href="resume/">
      <div class="pic"><img src="resume/미리보기.png" alt="이력서 첫 쪽 미리보기"></div>
      <b>이력서 · 자기소개서</b>
      <i class="go">보러 가기 →</i>
    </a>
    <a class="card folio" href="portfolio/">
      <div class="pic"><img src="portfolio/img/char_spring.png" alt="직접 만든 캐릭터 그림"></div>
      <b>포트폴리오</b>
      <i class="go">보러 가기 →</i>
    </a>
  </main>
  <footer><a href="https://github.com/humancjs">github.com/humancjs</a></footer>
</div>
</body>
</html>
